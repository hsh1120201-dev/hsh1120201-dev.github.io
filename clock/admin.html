<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>打卡紀錄後台｜新竹社會創新基地</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--y:#F9B72F;--r:#EC5415;--b:#0070BA;--g:#2e8b57;--bg:#FBF7EF;--ink:#2b2b2b;--mute:#777}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:2em 16px 3em}
header{text-align:center;margin-bottom:1em}h1{font-size:clamp(1.4em,4vw,1.9em);margin:.2em 0;letter-spacing:.06em}
.sub{color:var(--mute);margin:0;font-size:.92em}
.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin:14px 0;overflow-x:auto}
.card h2{margin:0 0 .6em;font-size:1.05em;padding-left:.6em;border-left:5px solid var(--y)}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:.45em 1em;font-weight:700}
.pri{background:var(--r);color:#fff}.sec{background:#fff;border:2px solid var(--y)}.del{background:#fff;color:#b3261e;border:1px solid #e3b3ad;font-size:.8em;padding:.2em .6em}
select{font:inherit;padding:.4em .6em;border-radius:10px;border:1px solid #ccc;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.bar .sp{flex:1}
.gate{background:#fff;border-radius:16px;padding:24px 18px;text-align:center;max-width:420px;margin:2em auto;box-shadow:0 2px 10px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;font-size:.92em}td,th{padding:6px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:.88em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.f{display:inline-block;font-size:.78em;border-radius:6px;padding:0 6px;margin:1px 2px;font-weight:700}
.f.late{background:#fde8dd;color:#a33a0c}.f.miss{background:#fdecea;color:#a12a1e}.f.ok{background:#e7f5ec;color:#1d6b3e}.f.extra{background:#e3effa;color:#0b4f86}.f.add{background:#f1efea;color:#666}
.k{font-size:.8em;color:var(--mute);margin-right:4px}
.hint{color:var(--mute);font-size:.85em;margin:.5em 0 0}.msg{font-size:.9em;color:#c0392b;min-height:1.2em}
tr.wk td:first-child{color:#a33a0c}
a{color:var(--b)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>打卡紀錄後台</h1><p class="sub">實際打卡 vs 班表：遲到、早退、沒打卡；忘記打卡可以補登</p></header>

<div id="gate" class="gate">
  <p>請先登入<br><small style="color:#888">Google 帳號，或超級管理員給你的帳號密碼</small></p>
  <button class="pri" id="login" type="button">登入</button>
</div>

<div id="app" hidden>
  <div class="bar">
    <select id="mon"></select>
    <button class="sec" id="reload" type="button">重新讀取</button>
    <button class="pri" id="add" type="button">＋補登打卡</button>
    <button class="sec" id="csv" type="button">下載 CSV</button>
    <span class="sp"></span>
    <span class="hint" id="who" style="margin:0"></span><button class="sec" id="out" type="button">登出</button>
  </div>
  <p class="msg" id="msg"></p>
  <p class="hint" id="baseInfo"></p>

  <div class="card"><h2>每人統計</h2><table><thead><tr><th>人員</th><th class="n">排班</th><th class="n">有打卡</th><th class="n">打卡時數</th><th class="n">班表時數</th><th class="n">遲到</th><th class="n">早退</th><th class="n">漏打</th></tr></thead><tbody id="sum"></tbody></table>
    <p class="hint">遲到＝上班卡晚於班表開始 5 分鐘以上；早退＝下班卡早於班表結束；漏打＝有排班但少了上班或下班卡（只算到今天）。打卡時數＝每天第一次上班到最後一次下班。</p></div>

  <div class="card"><h2>每日對照</h2><table><thead><tr><th>日期</th><th>班別</th><th>人員</th><th>班表時間</th><th>上班卡</th><th>下班卡</th><th>狀況</th></tr></thead><tbody id="days"></tbody></table></div>

  <div class="card"><h2>全部打卡紀錄</h2><table><thead><tr><th>時間</th><th>姓名</th><th>類型</th><th class="n">距離基地</th><th>備註</th><th>登記人</th><th></th></tr></thead><tbody id="raw"></tbody></table></div>
</div>
</main>
<script src="/backend/config.js?v=4"></script>
<script src="/backend/admin.js?v=5"></script>
<script src="/schedule/common.js?v=10"></script>
<script>
function $(id){return document.getElementById(id)}
var MONTHS=monthList(),M=null,ROWS=[],MODEL=null;
$("login").onclick=function(){Admin.login(start)};
$("out").onclick=function(){Admin.logout();location.reload()};
if(Admin.on())start();

function start(){$("gate").hidden=true;$("app").hidden=false;$("who").textContent=Admin.email();
  var n=new Date(),opts=MONTHS.filter(function(x){var d=(x.y-n.getFullYear())*12+x.m-(n.getMonth()+1);return x.y>=2026&&d<=0}).reverse();
  $("mon").innerHTML=opts.map(function(x){return '<option value="'+ym(x)+'">'+x.yr+" 年 "+x.m+" 月</option>"}).join("");
  load()}
$("mon").onchange=load;$("reload").onclick=load;
function cur(){var v=$("mon").value;return MONTHS.filter(function(x){return ym(x)==v})[0]}
function load(){M=cur();$("msg").textContent="讀取中…";
  Promise.all([Admin.api({action:"clockList",month:ym(M)}),loadMonth(M).catch(function(){return null})]).then(function(r){
    ROWS=r[0].rows;MODEL=r[1];var b=r[0].base;$("msg").textContent="";
    $("baseInfo").textContent=b&&b.set?"打卡範圍：基地 "+b.radius+" 公尺內（在超級管理員頁設定）":"⚠️ 還沒設定基地位置，現在任何地方都能打卡。請超級管理員到基地用手機打開超級管理員頁設定。";
    draw()},function(e){$("msg").textContent=e.message;if(/登入/.test(e.message)){$("gate").hidden=false;$("app").hidden=true}})}

function hm(t){return t?t.slice(11,16):""}
function hr(t){return +t.slice(11,13)+(+t.slice(14,16))/60+(+t.slice(17,19)||0)/3600}
function f2(h){var a=Math.floor(h+1e-9),b=Math.round((h-a)*60);if(b==60){a++;b=0}return a+":"+pad(b)}
function draw(){
  var by={},S={};ROWS.slice().sort(function(a,b){return a.time<b.time?-1:1}).forEach(function(r){var k=r.date+"|"+r.name;(by[k]=by[k]||[]).push(r)});
  function s(n){return S[n]||(S[n]={sh:0,has:0,h:0,sch:0,late:0,early:0,miss:0})}
  // 打卡時數
  Object.keys(by).forEach(function(k){var L=by[k],i=L.filter(function(r){return r.type=="上班"})[0],o=L.filter(function(r){return r.type=="下班"}).pop(),n=k.split("|")[1];
    s(n).has++;if(i&&o&&o.time>i.time)s(n).h+=hr(o.time)-hr(i.time)});
  var today=new Date(),tk=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate()),out=[],used={};
  var last=new Date(M.y,M.m,0).getDate(),R=MODEL?hourRule(MODEL):null;
  for(var d=1;d<=last;d++){var key=ym(M)+"-"+pad(d),wd=(new Date(M.y,M.m-1,d).getDay()+6)%7,x=MODEL&&MODEL.days[d],first=true;
    if(key>tk)break;
    var lines=[];
    if(x)[["early","早班"],["late","晚班"]].forEach(function(k){var p=(x[k[0]][0]||"").trim(),r=shiftRange(k[0],x[k[0]],wd,R);if(!r||!p)return;
      var L=by[key+"|"+p]||[];used[key+"|"+p]=1;
      // 同一天早晚班都同一人時，早班看第一張上班卡、晚班看最後一張下班卡
      var i=L.filter(function(z){return z.type=="上班"})[0],o=L.filter(function(z){return z.type=="下班"}).pop(),f=[],S1=s(p);
      S1.sh++;S1.sch+=r[1]-r[0];
      if(!i){f.push('<span class="f miss">沒打上班</span>');S1.miss++}else if(hr(i.time)>r[0]+5/60){f.push('<span class="f late">遲到 '+Math.round((hr(i.time)-r[0])*60)+' 分</span>');S1.late++}
      if(!o){if(key<tk||today.getHours()+today.getMinutes()/60>r[1]+.5){f.push('<span class="f miss">沒打下班</span>');S1.miss++}}
      else if(hr(o.time)<r[1]-1/60){f.push('<span class="f late">早退 '+Math.round((r[1]-hr(o.time))*60)+' 分</span>');S1.early++}
      if(!f.length)f.push('<span class="f ok">正常</span>');
      if(L.some(function(z){return /補登/.test(z.note)}))f.push('<span class="f add">有補登</span>');
      lines.push([k[1],p,f2(r[0])+"–"+f2(r[1]),i?hm(i.time):"",o?hm(o.time):"",f.join("")])});
    Object.keys(by).forEach(function(k){if(k.indexOf(key+"|")!=0||used[k])return;var L=by[k],i=L.filter(function(z){return z.type=="上班"})[0],o=L.filter(function(z){return z.type=="下班"}).pop();
      lines.push(["—",k.split("|")[1],"",i?hm(i.time):"",o?hm(o.time):"",'<span class="f extra">班表外打卡</span>'])});
    out.push(lines.map(function(l,j){return '<tr'+(wd>=5?' class="wk"':'')+'><td>'+(j?"":M.m+"/"+d+"（"+WK[wd]+"）")+"</td><td>"+l[0]+"</td><td>"+esc(l[1])+"</td><td>"+l[2]+"</td><td>"+(l[3]||"—")+"</td><td>"+(l[4]||"—")+"</td><td>"+l[5]+"</td></tr>"}).join(""));
  }
  $("days").innerHTML=out.reverse().join("")||'<tr><td colspan="7" class="hint">這個月還沒有班或打卡紀錄'+(MODEL?"":"（讀不到班表）")+'</td></tr>';
  $("sum").innerHTML=Object.keys(S).sort().map(function(n){var x=S[n];return "<tr><td>"+esc(n)+'</td><td class="n">'+x.sh+'</td><td class="n">'+x.has+'</td><td class="n">'+f2(x.h)+'</td><td class="n">'+f2(x.sch)+'</td><td class="n">'+(x.late||"")+'</td><td class="n">'+(x.early||"")+'</td><td class="n">'+(x.miss||"")+"</td></tr>"}).join("")||'<tr><td colspan="8" class="hint">沒有資料</td></tr>';
  $("raw").innerHTML=ROWS.slice().sort(function(a,b){return a.time<b.time?1:-1}).map(function(r){return "<tr><td>"+esc(r.time.slice(5,16))+"</td><td>"+esc(r.name)+"</td><td>"+esc(r.type)+'</td><td class="n">'+(r.dist!==""?esc(r.dist)+" m":"")+"</td><td>"+esc(r.note)+"</td><td>"+esc(r.by)+'</td><td><button class="del" data-row="'+r.row+'">刪除</button></td></tr>'}).join("")||'<tr><td colspan="7" class="hint">這個月還沒有打卡紀錄</td></tr>';
}
$("raw").onclick=function(e){var row=+e.target.dataset.row;if(!row)return;var r=ROWS.filter(function(x){return x.row==row})[0];
  if(!r||!confirm("確定刪除 "+r.name+" "+r.time.slice(5,16)+" 的"+r.type+"卡？"))return;
  Admin.api({action:"clockDel",row:row,time:r.time,name:r.name,month:ym(M)}).then(function(j){ROWS=j.rows;draw()},function(e){alert(e.message)})};
$("add").onclick=function(){var n=new Date(),names={};ROWS.forEach(function(r){names[r.name]=1});if(MODEL)Object.keys(monthHours(MODEL,M)).forEach(function(k){names[k]=1});
  var dl=document.getElementById("cnames")||document.body.appendChild(document.createElement("datalist"));dl.id="cnames";dl.innerHTML=Object.keys(names).map(function(k){return '<option value="'+esc(k)+'">'}).join("");
  var dd=ym(M)==ym({y:n.getFullYear(),m:n.getMonth()+1})?n.getDate():1;
  Admin.form({title:"補登打卡",ok:"補登",fields:[{k:"name",label:"姓名",list:"cnames"},{k:"type",label:"類型",options:["上班","下班"],value:"上班"},
    {k:"date",label:"日期",type:"date",value:ym(M)+"-"+pad(dd),half:true},{k:"time",label:"時間",type:"time",value:"09:00",half:true},{k:"note",label:"原因（例：忘記打卡）"}],
    submit:function(v){if(!v.name.trim())throw new Error("請填姓名");return Admin.api({action:"clockAdd",name:v.name.trim(),type:v.type=="下班"?"out":"in",date:v.date,time:v.time,note:v.note,month:ym(M)}).then(function(j){ROWS=j.rows;draw()})}})};
$("csv").onclick=function(){var L=[["時間","日期","姓名","類型","距離基地(公尺)","定位誤差(公尺)","備註","登記人"]].concat(ROWS.slice().sort(function(a,b){return a.time<b.time?-1:1}).map(function(r){return [r.time,r.date,r.name,r.type,r.dist,r.acc,r.note,r.by]}));
  var t="﻿"+L.map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\r\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="打卡紀錄_"+M.yr+"年"+M.m+"月.csv";a.click()};
</script>
</body>
</html>
