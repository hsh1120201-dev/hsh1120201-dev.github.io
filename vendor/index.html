<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>進駐廠商專區｜新竹社會創新基地</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
html,body{margin:0}
body{font-family:"Noto Sans TC",sans-serif;color:#333;background:#FBF7EF;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}.bg svg{width:100%;height:100%}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:2.5em 16px 3em}
header{text-align:center;margin-bottom:1.5em}
h1{font-size:clamp(1.5em,4vw,2em);margin:.2em 0;letter-spacing:.06em}
.sub{color:#666;margin:0}
h2{font-size:1.05em;margin:1.6em 0 .6em;padding-left:.6em;border-left:5px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{display:block;background:rgba(255,255,255,.97);border-radius:14px;padding:14px 16px;text-decoration:none;color:#222;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.item b{display:block;font-size:1.02em}
.item span{display:block;color:#777;font-size:.85em;margin-top:4px}
footer{text-align:center;color:#888;font-size:.85em;margin-top:2.5em}
.gate{background:rgba(255,255,255,.97);border-radius:16px;padding:28px 16px;text-align:center;max-width:420px;margin:1em auto;box-shadow:0 2px 10px rgba(0,0,0,.06)}
#gsi-btn{display:flex;justify-content:center;min-height:44px}.msg{color:#c0392b;font-size:.9em;min-height:1.2em}
.who{text-align:center;color:#888;font-size:.85em}.who a{color:#0070BA;cursor:pointer}
.search{position:relative;max-width:640px;margin:0 auto 1em}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:1.05em;padding:13px 44px 13px 18px;border:2px solid #e6dccb;border-radius:999px;background:#fff;outline:none}
.search input:focus{border-color:#0070BA}
.search input::-webkit-search-cancel-button{display:none}
.search button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.2em;color:#999;cursor:pointer;width:34px;height:34px;border-radius:50%}
.search button:hover{background:#f2ede4}
#res{max-width:640px;margin:0 auto}
.rmsg{text-align:center;color:#888;font-size:.9em;margin:.6em 0}
.ritem{display:block;background:rgba(255,255,255,.97);border-radius:12px;padding:12px 16px;margin-bottom:8px;text-decoration:none;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.ritem:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.ritem .k{display:inline-block;font-size:.75em;font-weight:700;color:#fff;background:var(--c,#0070BA);border-radius:999px;padding:1px 9px;margin-right:6px;vertical-align:1px}
.ritem .d{color:#888;font-size:.85em}
.ritem b{display:block;margin-top:4px}
.ritem p{margin:4px 0 0;color:#666;font-size:.87em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ritem mark{background:#FDE7B4;color:inherit;border-radius:3px}
body.searching main>section{display:none}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#EC5415"/><stop offset="1" stop-color="#F9B72F" stop-opacity="0"/></linearGradient>
<linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#0070BA" stop-opacity="0"/><stop offset=".6" stop-color="#0070BA"/></linearGradient>
<radialGradient id="r1"><stop offset="0" stop-color="#F9B72F" stop-opacity=".35"/><stop offset="1" stop-color="#F9B72F" stop-opacity="0"/></radialGradient>
<radialGradient id="r2"><stop offset="0" stop-color="#0070BA" stop-opacity=".18"/><stop offset="1" stop-color="#0070BA" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="180" cy="160" r="420" fill="url(#r1)"/>
<circle cx="1450" cy="880" r="480" fill="url(#r2)"/>
<path d="M-50 820 Q 500 640 1100 760" stroke="url(#g1)" stroke-width="34" fill="none" stroke-linecap="round" opacity=".85"/>
<path d="M300 900 Q 900 760 1700 860" stroke="url(#g2)" stroke-width="34" fill="none" stroke-linecap="round" opacity=".85"/>
<path d="M1100 120 Q 1350 60 1700 140" stroke="#F9B72F" stroke-width="14" fill="none" stroke-linecap="round" opacity=".5"/>
</svg></div>
<main>
<header><h1>進駐廠商專區</h1><p class="sub">新竹社會創新基地・進駐團隊常用連結</p></header>
<div class="search" role="search"><input id="q" type="search" placeholder="搜尋活動、公告、成果花絮、常用連結…" aria-label="站內搜尋" autocomplete="off"><button id="qx" type="button" aria-label="清除" hidden>✕</button></div>
<div id="res" aria-live="polite"></div>
<section><h2 style="--c:#0070BA">基地消息</h2><div class="grid"><a class="item" href="/board/"><b>進駐團隊公告欄</b><span>活動、課程消息與成果花絮</span></a><a class="item" href="/activity/"><b>活動報名</b><span>報名基地講座與工作坊</span></a></div></section>
<section><h2 style="--c:#EC5415">意見回饋</h2><div class="grid"><a class="item" href="https://docs.google.com/forms/d/e/1FAIpQLScaXr4F0QR0A-KGe8OSkfuj42kgWBfYEam1XUkiTRqIBmj4uQ/viewform" target="_blank" rel="noopener"><b>進駐團隊意見箱</b><span>空間、設備、服務的建議</span></a><a class="item" href="https://docs.google.com/forms/d/e/1FAIpQLScrMShGvC0ex5igQXjCpkhZ9pznWdEHXjDQ9VGPujIZ1LgDUw/viewform" target="_blank" rel="noopener"><b>系統使用意見調查</b><span>網站使用建議</span></a></div></section>
<section><h2 style="--c:#F9B72F">聯絡基地</h2><div class="grid"><a class="item" href="https://hys.hsinchu.gov.tw/startupHub" target="_blank" rel="noopener"><b>新竹社會創新基地官網</b></a><a class="item" href="https://line.me/R/ti/p/@991xengs" target="_blank" rel="noopener"><b>LINE 官方帳號</b></a><a class="item" href="https://www.youtube.com/@hhsihub" target="_blank" rel="noopener"><b>YouTube 頻道</b></a></div></section>
<footer>基地電話 03-5593142 分機 3529｜本頁僅供進駐團隊使用</footer>
</main>
<script>
(function(){
  "use strict";
  var API="https://script.google.com/macros/s/AKfycbyRp9pfZlfnr-UiOJizY5ASMGFyHFLM8pzPBOV4QfUZyQOuaZQ6S-k7HS-63Kvji0Xrlw/exec"; // 與活動報名、公告欄共用
  var q=document.getElementById("q"),qx=document.getElementById("qx"),res=document.getElementById("res");
  var data=null,loading=null,failed=false;
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var WD="日一二三四五六";
  function dfmt(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");if(!m)return"";return m[1]+"/"+m[2]+"/"+m[3]+"（"+WD[new Date(+m[1],m[2]-1,+m[3]).getDay()]+"）"}
  function drange(a,b){var x=dfmt(a);return b&&a&&b>a?x+"～"+(a.slice(0,4)===b.slice(0,4)?dfmt(b).slice(5):dfmt(b)):x}
  var COLOR={"活動":"#0070BA","成果花絮":"#c0661c","團隊活動":"#2e8b57","公告":"#EC5415","參訪":"#8e44ad","課程":"#0e7c86","常用連結":"#777"};
  var ST={open:"報名中",feedback:"回饋中",closed:"已結束"};
  /* 本頁的常用連結也一起搜 */
  var links=[].map.call(document.querySelectorAll("main .item"),function(a){return{kind:"常用連結",title:a.querySelector("b").textContent,text:(a.querySelector("span")||{}).textContent||"",href:a.getAttribute("href"),ext:a.target==="_blank"}});
  function load(){
    if(data||loading)return loading;
    loading=fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"board"})})
      .then(function(r){return r.json()}).then(function(j){
        if(!j.ok)throw new Error(j.error);
        var acts=(j.activities||[]).filter(function(a){return a&&a.title}).map(function(a){return{kind:"活動",title:a.title,date:a.date,sub:[ST[a.status]||"",a.time,a.location].filter(Boolean).join("・"),desc:a.description,text:[a.description,a.location,a.semester].join(" "),href:"/activity/?id="+encodeURIComponent(a.id)}});
        var posts=(j.posts||[]).filter(function(p){return p&&p.title}).map(function(p){return{kind:p.type,title:p.title,date:p.date,end:p.endDate,sub:[p.base&&p.base!=="兩基地"?p.base+"基地":"",p.team,p.time,p.location].filter(Boolean).join("・"),desc:p.body,text:[p.body,p.team,p.location,p.base].join(" "),href:p.type==="成果花絮"?"/board/#p-"+encodeURIComponent(p.id):"/board/"}});
        data=acts.concat(posts);failed=false;
      }).catch(function(){failed=true;data=null}).then(function(){loading=null;run()});
    return loading;
  }
  function hl(s,ws){s=esc(s);ws.forEach(function(w){var e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");s=s.replace(new RegExp(e,"gi"),function(m){return"<mark>"+m+"</mark>"})});return s}
  function snip(t,ws){t=String(t||"").replace(/\s+/g," ").trim();var i=-1;ws.some(function(w){i=t.toLowerCase().indexOf(w.toLowerCase());return i>=0});return i>30?"…"+t.slice(i-20):t}
  function run(){
    var v=q.value.trim();qx.hidden=!v;document.body.classList.toggle("searching",!!v);
    if(!v){res.innerHTML="";return}
    var ws=v.split(/\s+/).filter(Boolean);
    var pool=links.concat(data||[]);
    var hit=pool.filter(function(x){var all=[x.kind,x.title,x.sub,x.text,x.date,dfmt(x.date),x.end].join(" ").toLowerCase();return ws.every(function(w){return all.indexOf(w.toLowerCase())>=0})});
    hit.sort(function(a,b){var ta=a.title.toLowerCase().indexOf(ws[0].toLowerCase())>=0,tb=b.title.toLowerCase().indexOf(ws[0].toLowerCase())>=0;if(ta!==tb)return ta?-1:1;return(b.date||"").localeCompare(a.date||"")});
    var h=hit.slice(0,40).map(function(x){var d=drange(x.date,x.end),t=snip(x.desc==null?x.text:x.desc,ws);
      return'<a class="ritem" style="--c:'+(COLOR[x.kind]||"#0070BA")+'" href="'+esc(x.href)+'"'+(x.ext?' target="_blank" rel="noopener"':"")+'><span class="k">'+esc(x.kind)+'</span><span class="d">'+esc([d,x.sub].filter(Boolean).join("｜"))+"</span><b>"+hl(x.title,ws)+"</b>"+(t?"<p>"+hl(t,ws)+"</p>":"")+"</a>"}).join("");
    var note=loading?"資料載入中…":failed?"活動與公告暫時載入失敗，目前只搜尋本頁連結。":"";
    res.innerHTML=(note?'<p class="rmsg">'+note+"</p>":"")+(h||(loading?"":'<p class="rmsg">找不到「'+esc(v)+'」相關的內容，換個關鍵字試試。</p>'))+(hit.length>40?'<p class="rmsg">只列出前 40 筆，可以多打幾個字縮小範圍。</p>':"");
  }
  q.addEventListener("focus",load);
  q.addEventListener("input",function(){if(!data&&!loading)load();run()});
  qx.addEventListener("click",function(){q.value="";run();q.focus()});
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
})();
</script>
</body>
</html>
