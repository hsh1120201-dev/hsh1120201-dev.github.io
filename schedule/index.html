<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>基地班表｜新竹社會創新基地</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
:root{--y:#F9B72F;--r:#EC5415;--b:#0070BA;--bg:#FBF7EF;--card:#fff;--ink:#2b2b2b;--mute:#777;--line:#eadfca;--off:#f1efea}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:2em 16px 3em}
header{text-align:center;margin-bottom:1.2em}
h1{font-size:clamp(1.5em,4vw,2em);margin:.2em 0;letter-spacing:.06em}
.sub{color:var(--mute);margin:0;font-size:.95em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:1em 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--y);background:#fff;color:var(--ink);border-radius:999px;padding:.4em .8em;min-width:3.4em;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--y)}
select{font:inherit;padding:.4em .6em;border-radius:10px;border:1px solid #ccc;background:#fff}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85em;color:var(--mute);margin-bottom:.8em}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:3px;vertical-align:-.05em;margin-right:4px}
.status{text-align:center;color:var(--mute);font-size:.9em;min-height:1.3em}
.status.warn{color:#b34700;background:#fff3e0;border-radius:10px;padding:.5em 1em;max-width:720px;margin:0 auto .8em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-weight:700;padding:.4em 0;background:var(--y);border-radius:8px}
.wd.sun{background:#f3d9a0}
.day{background:var(--card);border-radius:10px;padding:6px 7px;min-height:118px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent;display:flex;flex-direction:column;gap:4px}
.day.empty{background:transparent;box-shadow:none}
.day.today{border-color:var(--r)}
.day.dim{opacity:.35}
.day.hit{border-color:var(--b);box-shadow:0 0 0 3px rgba(0,112,186,.15)}
.dh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dn{font-weight:800;font-size:1.1em}
.dwk{display:none;color:var(--mute);font-size:.85em}
.ev{font-size:.75em;background:#fde8dd;color:#a33a0c;border-radius:6px;padding:1px 6px;font-weight:700}
.ev.hol{background:#f8d7da;color:#8a1c24}
.sh{border-radius:7px;padding:3px 6px;font-size:.88em;line-height:1.35}
.sh.e{background:#fff5df;border-left:4px solid var(--y)}
.sh.l{background:#e8f1fa;border-left:4px solid var(--b)}
.sh.off{background:var(--off);border-left-color:#ccc;color:#999}
.sh .k{font-size:.75em;color:var(--mute);margin-right:3px}
.sh b{font-weight:700}
.sh .n{display:block;font-size:.78em;color:#8a6d3b}
.sh.l .n{color:#3d6a91}
.sh.off .n{color:#a07b70}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1.2em}
.notes div{background:#fff;border-radius:12px;padding:12px 16px;white-space:pre-line;font-size:.9em;color:#555;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.summary{margin-top:1.2em;background:#fff;border-radius:12px;padding:12px 16px;font-size:.9em;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hint{color:var(--mute);font-size:.82em;margin:.6em 0 0}
.summary h3{margin:0 0 .4em;font-size:1em}
.summary table{border-collapse:collapse;width:100%}
.summary td,.summary th{padding:4px 8px;border-bottom:1px solid #eee;text-align:left}
.summary th{color:var(--mute);font-weight:600}
footer{text-align:center;color:#888;font-size:.85em;margin-top:2em}
footer a{color:var(--b)}
@media (max-width:760px){
  .cal{grid-template-columns:1fr;gap:8px}
  .wd,.day.empty{display:none}
  .day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .dh{width:100%}
  .dwk{display:inline}
  .sh{flex:1 1 45%}
  .notes{grid-template-columns:1fr}
}
@media print{body{background:#fff}.bar,.legend,footer,.summary{display:none}.day{box-shadow:none;border:1px solid #ddd;min-height:90px}}
</style>
</head>
<body>
<main>
<header><h1>基地班表</h1><p class="sub">新竹社會創新基地・早班／晚班值勤</p></header>
<div class="bar">
  <select id="yr"><option value="115">115年</option><option value="116">116年</option><option value="117">117年</option></select>
  <div class="tabs" id="tabs"></div>
  <label>只看 <select id="who"><option value="">全部人員</option></select></label>
</div>
<div class="legend">
  <span><i class="dot" style="background:var(--y)"></i>早班</span>
  <span><i class="dot" style="background:var(--b)"></i>晚班</span>
  <span><i class="dot" style="background:#fde8dd"></i>活動／場租</span>
  <span><i class="dot" style="background:#f8d7da"></i>國定假日</span>
  <span><i class="dot" style="background:#ddd"></i>休館・不須值勤・無晚班</span>
  <span><i class="dot" style="background:var(--r)"></i>今天</span>
</div>
<p class="status" id="status">讀取中…</p>
<div class="cal" id="cal"></div>
<div class="notes" id="notes"></div>
<div class="summary" id="summary" hidden></div>
<footer><a href="admin.html">班表後台</a>｜<a id="src" target="_blank" rel="noopener">開啟試算表</a><br>本頁僅供內部使用，請勿對外分享</footer>
</main>
<script src="/backend/config.js?v=4"></script>
<script src="/backend/admin.js?v=5"></script>
<script src="common.js?v=8"></script>
<script>
var MONTHS=monthList(),cur=0,RATES={},ALL=false,ME="";
// 薪水：管理員（後台 Google 登入）看全部；其他人輸入姓名＋密碼只看自己
function getMe(){try{return JSON.parse(sessionStorage.getItem("pay-me")||"null")}catch(_){return null}}
function payLogin(name,pw){return fetch(BASE_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"myPay",name:name,pw:pw})}).then(function(r){return r.json()},function(){throw new Error("連不上後台")}).then(function(j){if(!j.ok)throw new Error(j.error||"失敗");
  RATES={"預設":j.def};if(j.rate>0)RATES[j.name]=j.rate;ME=j.name;try{sessionStorage.setItem("pay-me",JSON.stringify({name:name,pw:pw}))}catch(_){}return j})}
function pwForm(first){var m=getMe();if(!m)return;
  Admin.form({title:first?"第一次登入，請設定自己的密碼":"修改密碼",ok:"儲存密碼",fields:[{k:"a",label:"新密碼（4 個字以上）",type:"password"},{k:"b",label:"再輸入一次",type:"password"}],
    submit:function(v){if(v.a.length<4)throw new Error("新密碼要 4 個字以上");if(v.a!==v.b)throw new Error("兩次輸入的密碼不一樣");
      return fetch(BASE_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"changePw",name:m.name,pw:m.pw,newPw:v.a})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||"失敗");
        try{sessionStorage.setItem("pay-me",JSON.stringify({name:m.name,pw:v.a}))}catch(_){}})}});
}
function initPay(){
  var m=getMe();
  if(superMode())return superCall({action:"rates"}).then(function(j){RATES=j.rates||{};ALL=true;render()},function(){if(m)payLogin(m.name,m.pw).then(render,function(){})});
  var m=getMe();if(m)payLogin(m.name,m.pw).then(render,function(){try{sessionStorage.removeItem("pay-me")}catch(_){}})}
document.addEventListener("click",function(e){var a=e.target.dataset&&e.target.dataset.pay;if(!a)return;
  if(a=="out"){ME="";RATES={};try{sessionStorage.removeItem("pay-me")}catch(_){}render();return}
  if(a=="pw"){pwForm(false);return}
  var names=Object.keys(monthHours(window._lastModel||{days:{}},MONTHS[cur]));
  Admin.form({title:"登入查看我的時數與薪水",ok:"查看",fields:[{k:"name",label:"姓名",options:names.length?names:[""],value:names[0]},{k:"pw",label:"密碼（找管理員拿）",type:"password"}],
    submit:function(v){return payLogin(v.name,v.pw).then(function(j){render();if(j.usedDefault)setTimeout(function(){pwForm(true)},50)})}});
});
function $(id){return document.getElementById(id)}
$("src").href="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";
function shiftHTML(cls,label,lines){
  if(!lines.length||!lines.join(""))return "";
  var p=lines[0],off=OFF.test(p);
  return '<div class="sh '+cls+(off?' off':'')+'"><span class="k">'+label+'</span><b>'+esc(p)+'</b>'+lines.slice(1).map(function(n){return '<span class="n">'+esc(n)+'</span>'}).join("")+'</div>';
}
function render(){
  var M=MONTHS[cur];
  $("tabs").querySelectorAll("button").forEach(function(b){b.className=+b.dataset.i==cur?"on":""});
  $("status").className="status";$("status").textContent="讀取中…";
  loadMonth(M).then(function(model){
    var st=$("status");
    var empty=!model;if(empty)model={days:{},notes:[]};
    if(empty){st.className="status warn";st.textContent="這個月還沒有班表，可以到後台排班（國定假日已先標出）。"}
    else if(model.draft){st.className="status warn";st.textContent="這是依 12 月模式自動排的草稿，到後台按「儲存這個月」後就會變成正式班表。"}
    else st.textContent=(model.fromData?"後台班表":"試算表「"+M.sheet+"」分頁")+"・"+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})+" 讀取";
    window._lastModel=model;var cnt=monthHours(model,M),list=Object.keys(cnt);
    var who=$("who").value;if(list.indexOf(who)<0)who="";
    $("who").innerHTML='<option value="">全部人員</option>'+list.map(function(n){return '<option'+(n==who?' selected':'')+'>'+esc(n)+'</option>'}).join("");
    var h=WK.split("").map(function(w,i){return '<div class="wd'+(i==6?' sun':'')+'">'+w+'</div>'}).join("");
    var first=(new Date(M.y,M.m-1,1).getDay()+6)%7,last=new Date(M.y,M.m,0).getDate(),now=new Date();
    for(var i=0;i<first;i++)h+='<div class="day empty"></div>';
    for(var d=1;d<=last;d++){
      var x=model.days[d]||{ev:[],early:[],late:[]},wd=(first+d-1)%7;
      var hn=holidayName(M.y,M.m,d),evs=x.ev.slice();if(hn&&!evs.some(function(e){return e.indexOf(hn.replace("補假",""))>=0}))evs.push(hn);
      var hit=who&&(x.early[0]==who||x.late[0]==who);
      var cls="day"+(now.getFullYear()==M.y&&now.getMonth()+1==M.m&&now.getDate()==d?" today":"")+(who?(hit?" hit":" dim"):"");
      h+='<div class="'+cls+'"><div class="dh"><span class="dn">'+d+'</span><span class="dwk">（'+WK[wd]+'）</span>'+evs.map(function(e){return '<span class="ev'+(e==hn?' hol':'')+'">'+esc(e)+'</span>'}).join("")+'</div>'+shiftHTML("e","早",x.early)+shiftHTML("l","晚",x.late)+'</div>';
    }
    $("cal").innerHTML=h;
    $("notes").innerHTML=(model.notes||[]).map(function(n){return '<div>'+esc(n)+'</div>'}).join("");
    var tot=0,pay=0,showPay=ALL||!!ME;list.forEach(function(k){tot+=cnt[k].h;pay+=Math.round(cnt[k].h*payRate(RATES,k,M.y))});
    function can(k){return ALL||k==ME}
    function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
    $("summary").hidden=!list.length;
    $("summary").innerHTML='<h3>本月班數、時數與薪水 <span style="float:right;font-weight:400;font-size:.9em">'+(ALL?'管理員：看得到全部薪水':ME?esc(ME)+' 已登入 <button type="button" data-pay="pw" class="adm-edit">改密碼</button><button type="button" data-pay="out" class="adm-edit">登出</button>':'<button type="button" data-pay="in" class="adm-edit">登入查看我的時數薪水</button>')+'</span></h3>'+
      (ME&&cnt[ME]?'<p style="background:#fff5df;border-radius:10px;padding:8px 12px;margin:.4em 0">'+esc(ME)+' 本月 '+cnt[ME].h+' 小時 × 時薪 '+payRate(RATES,ME,M.y)+' 元 ＝ <b style="font-size:1.2em">'+money(cnt[ME].h*payRate(RATES,ME,M.y))+'</b></p>':ME?'<p class="hint">'+esc(ME)+' 這個月沒有排班</p>':'')+
      (showPay?'<table><tr><th>人員</th><th>早班</th><th>晚班</th><th>時數</th><th>時薪</th><th>薪水</th></tr>'+list.filter(can).map(function(k){var r=payRate(RATES,k,M.y);return '<tr'+(k==who?' style="background:#e8f1fa"':'')+'><td>'+esc(k)+'</td><td>'+cnt[k].e+'</td><td>'+cnt[k].l+'</td><td>'+cnt[k].h+'</td><td>'+r+'</td><td><b>'+money(cnt[k].h*r)+'</b></td></tr>'}).join("")+(ALL?'<tr><th>合計</th><th></th><th></th><th>'+Math.round(tot*100)/100+'</th><th></th><th>'+money(pay)+'</th></tr>':'')+'</table>':'<p class="hint">班數、時數和薪水要登入才看得到：按右上「登入查看」，用自己的名字和密碼登入。</p>')+(showPay?'<p class="hint">薪水＝時數 × 時薪（四捨五入到元），時薪在班表後台設定，不會低於當年最低工資（'+M.y+' 年 '+minWage(M.y)+' 元）。</p>':'')+'<p class="hint">時數依當月備註的值勤時間計算（休息時間不扣；晚班沒寫時段當 B 時段；格子裡寫「15:00-20:00」或「17:00到班」會照寫的算）。</p>';
  });
}
function drawTabs(){var yr=MONTHS[cur].yr;$("yr").value=yr;$("tabs").innerHTML=MONTHS.map(function(M,i){return M.yr==yr?'<button type="button" data-i="'+i+'">'+M.label+'</button>':""}).join("")}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;cur=+b.dataset.i;try{localStorage.setItem("sched-month3",cur)}catch(_){}render()});
$("yr").addEventListener("change",function(){var yr=+this.value,m=MONTHS[cur].m;MONTHS.forEach(function(M,i){if(M.yr==yr&&M.m==m)cur=i});drawTabs();render()});
$("who").addEventListener("change",render);
(function(){var n=new Date(),k=-1;MONTHS.forEach(function(M,i){if(M.y==n.getFullYear()&&M.m==n.getMonth()+1)k=i});
  try{var s=localStorage.getItem("sched-month3");if(s!==null&&MONTHS[+s])k=+s}catch(_){}
  cur=k>=0?k:0})();
drawTabs();render();initPay();
</script>
</body>
</html>
